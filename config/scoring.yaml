# Scoring thresholds (DESIGN.md §6). Every threshold lives here, never in code.
# 004 adds only the Shorts cut-off; 023 fills in the rest.

# A video at or under this many seconds counts as a Short (YouTube allows Shorts up to 3 min).
shorts_max_seconds: 180

# Competitor discovery filter (006, DESIGN.md §4.3). A search hit's channel survives only if
# it passes all three.
discovery:
  # Absolute subscriber floor and cap (0 = no cap). Research studies channels that have
  # already found an audience, not channels the size of our own (009: a same-size band
  # around a small own channel returned 1-subscriber channels).
  subs_min: 10000
  subs_max: 0
  # At least one search hit must have this many views: the channel has gone viral once.
  hit_views_min: 100000
  # Competitors compete for the same viewer, so they must be about the same subject: at
  # least one of these words (lower-case tokens) in the channel title, its description or
  # a hit title. Edit freely; plurals are separate entries.
  topic_words:
    - animal
    - animals
    - wildlife
    - creature
    - creatures
    - predator
    - predators
    - species
    - beast
    - beasts
    - zoo
    - snake
    - snakes
    - shark
    - sharks
    - lion
    - lions
    - tiger
    - tigers
    - bear
    - bears
    - wolf
    - wolves
    - elephant
    - elephants
    - crocodile
    - crocodiles
    - gorilla
    - gorillas
    - monkey
    - monkeys
    - spider
    - spiders
    - insect
    - insects
    - bird
    - birds
    - fish
    - dog
    - dogs
    - cat
    - cats
  # ... and in this language. Video language tags decide when present (most hits must be
  # tagged `language`); otherwise this share of the letters in the hit titles must be
  # Latin script. search.list also gets relevanceLanguage=language, which is free.
  language: en
  latin_share_min: 0.9
  # Fraction of the channel's search hits at or under shorts_max_seconds.
  shorts_share_min: 0.7
  # Distinct query words that appear in the channel's hit titles. 1, not 2: once the hype
  # words were stripped (034) the seed queries share only two content words, so 2 meant
  # "every query word" and the third real run of 009 kept nothing new. The topic_words
  # screen above is what keeps the subject honest; this only asks for one shared word.
  keyword_overlap_min: 1

# Competitor metrics (010, DESIGN.md §4.4). Computed per channel × window × format.
competitor_metrics:
  # A video is an outlier when its views are at least this many times ...
  outlier_multiplier: 3
  # ... the median views of the channel's newest this-many videos in the same format.
  outlier_window_videos: 30
  # A video younger than this many days at scoring time is "unsettled" (046): its views
  # mean nothing yet, so it is left out of views_median/p25/p75/max, the outlier baseline
  # and the outlier count. It still counts for uploads_per_week and video_count
  # (video_count_settled is the other figure). The competitor packet marks it settled: false.
  min_age_days: 7
  # Length distribution. A video goes into the first bucket whose max_seconds it does not
  # exceed, so a 180 s Short is "60–180s". The last bucket has no top (max_seconds: null).
  length_buckets:
    - {label: "≤30s", max_seconds: 30}
    - {label: "30–60s", max_seconds: 60}
    - {label: "60–180s", max_seconds: 180}
    - {label: "3–8min", max_seconds: 480}
    - {label: "8–20min", max_seconds: 1200}
    - {label: "20min+", max_seconds: null}

# Video summaries (044): which videos `analyse --summaries` picks. Each channel's outliers
# (the competitor_metrics rule above) come first, then its newest; channels take turns so
# a daily poster cannot crowd out the rest. At most this many candidates per channel a run.
video_summaries:
  per_channel: 8

# Niche validation (022, DESIGN.md §5.3): how `scout validate` samples a niche.
niche_validation:
  # A sampled channel is "small" (a newcomer) when it has fewer subscribers than this ...
  small_subs_max: 10000
  # ... AND was created within this many days. Both, not either.
  small_age_days: 365
  # Searches look back this far (publishedAfter = now - lookback_days).
  lookback_days: 365
  # At most this many distinct channels are sampled, the most-hit first.
  max_channels: 80
  # After this many searches, stop if they already found max_channels distinct channels.
  early_stop_after_searches: 4
  # Newest uploads fetched per sampled channel (one playlist page, one videos call).
  videos_per_channel: 30
  # search.list relevanceLanguage (free): the scout looks for English-language niches.
  language: en
  # Relevance gate (049). A search hit does not put a channel in the niche: 027's samples
  # were led by BBC News, NBC News and Kurzgesagt. `score --niches` screens each sampled
  # channel on the titles and categories of its newest videos_per_channel videos; a channel
  # that fails stays in niche_channels with a reason and the scorer ignores it. The script
  # check reuses discovery.latin_share_min, and the English check runs when
  # discovery.language is en. A channel with no stored videos is kept (no evidence).
  relevance:
    # News outlets: at least this share of the videos in these YouTube categories
    # (25 = News & Politics) ...
    news_category_ids: ["25"]
    news_share_min: 0.5
    # Not English: at least this share of the titles carry a non-English function word
    # (le, der, que, ...) and they outnumber the titles with an English one.
    foreign_title_share_min: 0.2
    # Off-topic: fewer than this share of the titles contain a word of the niche's queries
    # or label. 0 shared words always fails; 0.1 also drops the mega-channel with one
    # on-topic video in 30 (Kurzgesagt, Cleo Abram in 027).
    topical_title_share_min: 0.1

# Niche scoring (023, DESIGN.md §6). The pure functions in src/ytscout/scoring/
# {opportunity,money,effort,final}.py read every number from this section and nothing
# else. small_subs_max / small_age_days repeat niche_validation and outlier_multiplier /
# outlier_window_videos repeat competitor_metrics on purpose: each section is read by a
# different command, and tests/test_scoring.py fails if the pairs drift apart.
niche_scoring:
  # A channel is "small" (a newcomer) when subs < small_subs_max AND it was created fewer
  # than small_age_days before the scoring date. Hidden subs or no creation date means
  # "unknown": counted in the niche totals, never in the small set.
  small_subs_max: 10000
  small_age_days: 365
  # A video is an outlier when views >= outlier_multiplier x the median views of the
  # channel's newest outlier_window_videos videos in the same format ...
  outlier_multiplier: 3
  outlier_window_videos: 30
  # ... AND views >= this floor for the format. Keeps a 3-view video with a 1-view median
  # from counting as a hit.
  outlier_floor_views:
    shorts: 10000
    longform: 2000
  # The "last 90 days": views and outliers count only for videos published within it.
  window_days: 90
  # opportunity = sum of weight x component. small_outlier_rate and newcomer_view_share
  # are taken as-is; inverse_concentration weights (1 - concentration).
  weights:
    small_outlier_rate: 0.5
    newcomer_view_share: 0.3
    inverse_concentration: 0.2
  # concentration = share of window views held by the top_n_concentration channels.
  top_n_concentration: 3
  # Fewer small channels than this flags the niche low_confidence and caps opportunity.
  low_confidence_min_small: 5
  low_confidence_cap: 0.4
  # Videos a month the pipeline would publish in each format (DESIGN.md 6.4); a niche
  # may override it. Multiplies manual hours per video into hours per month.
  videos_per_month:
    shorts: 20
    longform: 4
  # score = est GBP/month / max(manual hours/month, this floor). Stops a fully automated
  # niche scoring infinity.
  manual_hours_floor_per_month: 2
  # The newcomer monthly views the GBP/month estimate anchors on (DESIGN.md 6.2, 051): this
  # percentile of the monthly views of the "active" small channels, those that published at
  # least newcomer_min_window_videos in-format videos inside window_days. 75 = a good
  # newcomer, not the typical one: the median small Shorts channel gets ~2,000 views a
  # month, which rounds every Shorts niche to GBP 0. p25 and p75 of the same active set are
  # still reported as the band.
  newcomer_views_percentile: 75
  newcomer_min_window_videos: 1
  # Months to Partner Programme monetisation (DESIGN.md 6.6, 054). The three thresholds
  # are YouTube's, from the Help page "YouTube Partner Program overview & eligibility"
  # (https://support.google.com/youtube/answer/72851), checked on last_reviewed. Re-check
  # them when the page changes; the scorer reads only the numbers.
  ypp:
    source: https://support.google.com/youtube/answer/72851
    last_reviewed: "2026-09-27"
    # Both formats: public subscribers.
    subs_min: 1000
    # Long-form: public watch hours in the last 12 months.
    watch_hours_12mo: 4000
    # Shorts: public Shorts views in the last 90 days.
    views_90d: 10000000
    # ASSUMPTION, not a YouTube figure: the share of each long-form video's length an
    # average viewer watches, which turns views into watch hours. 0.4 is a typical
    # audience-retention figure for a 5-15 minute faceless video; adjust from the own
    # channel's Analytics when it has long-form.
    retention_share: 0.4
    # The newcomer starts at zero and its monthly rate rises linearly to the anchor rate
    # over this many months, then holds (the model in ypp.py's docstring). 0 = no ramp.
    ramp_months: 3
    # subs_per_month = subs / channel age in months; ages below this floor are raised to it
    # so a days-old channel with a few hundred subs does not set the pace.
    age_floor_months: 1
